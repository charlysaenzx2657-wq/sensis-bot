body{background:#03070D;font-family:system-ui,sans-serif;color:#E4F2FF;min-height:100vh;display:flex;flex-direction:column;align-items:center;}

/* Mi chat (abajo) */
#myChat{border-top:1px solid rgba(56,190,255,0.1);background:rgba(3,7,20,0.98);}
#myChatMessages{padding:10px 12px;display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;}

.btns{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap;padding-left:2px;}

.opt-btn:disabled{opacity:0.4;cursor:default;}
.copy-btn{display:block;margin-top:8px;width:100%;background:rgba(56,190,255,0.08);border:1px solid rgba(56,190,255,0.25);border-radius:9px;padding:8px;color:#38BEFF;font-size:10px;font-weight:800;letter-spacing:2px;cursor:pointer;text-transform:uppercase;}
.copy-btn.copied{background:rgba(61,255,143,0.12);border-color:rgba(61,255,143,0.35);color:#3DFF8F;}

.input-area{padding:8px 12px 14px;display:flex;gap:8px;}
#msgInput{flex:1;background:rgba(4,16,48,0.92);border:1px solid rgba(56,190,255,0.15);border-radius:12px;padding:11px 15px;color:#E4F2FF;font-family:inherit;font-size:14px;font-weight:600;outline:none;}
#msgInput::placeholder{color:rgba(100,170,255,0.28);}
#sendBtn{background:linear-gradient(160deg,#2BB8FF,#0A84FF,#0052D4);border:none;border-radius:12px;padding:11px 16px;color:#fff;font-weight:900;font-size:17px;cursor:pointer;}

.limit-msg{text-align:center;padding:10px;font-size:11px;font-weight:700;letter-spacing:2px;color:rgba(255,85,102,0.7);}

/* Tabs */
.tabs{display:flex;border-bottom:1px solid rgba(56,190,255,0.1);}
.tab{flex:1;padding:10px;text-align:center;font-size:10px;font-weight:800;letter-spacing:2px;cursor:pointer;color:rgba(160,215,255,0.4);text-transform:uppercase;transition:all 0.2s;}
.tab.active{color:#38BEFF;border-bottom:2px solid #38BEFF;}
</style>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBbQYpPdRH_rVeZmMLwU8vBvIX_9-EBnO8",
  authDomain: "sensis-good-ff-217fd.firebaseapp.com",
  projectId: "sensis-good-ff-217fd",
  storageBucket: "sensis-good-ff-217fd.firebasestorage.app",
  messagingSenderId: "708862120786",
  appId: "1:708862120786:web:a374242f39ec464408608b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ── LÓGICA SENSIS ──────────────────────────────────────────
const _GA=new Set(["Samsung","Google Pixel","OnePlus","Sony","Sony Ericsson","Razer","Sharp","Sharp Aquos","Nubia","RED"]);
const _GB=new Set(["Motorola","Nokia","LG","HTC","Asus","Lenovo","TCL","Meizu","Meitu","Microsoft"]);
const _GB2=new Set(["Xiaomi","Poco"]);
const _GB3=new Set(["Honor","Huawei","HMD Global"]);
const _GB4=new Set(["Realme","Oppo","Vivo"]);
const _GC=new Set(["Infinix","Tecno","Itel","iTel","Alcatel","BLU","Wiko","Blackview","Doogee","Oukitel","Cubot","Ulefone","UMIDIGI","Gionee","Micromax","Lava","Intex","Karbonn","Celkon","Spice","QMobile","Walton","Symphony","MyPhone","Cherry Mobile"]);
const MARCAS=["iPhone","Samsung","Motorola","Xiaomi","Honor","Huawei","Realme","Oppo","Vivo","Google Pixel","OnePlus","Sony","Asus","Lenovo","Nokia","LG","HTC","TCL","Poco","Infinix","Tecno","Alcatel","BLU","Blackview","Doogee","Oukitel","Cubot","Ulefone","UMIDIGI","Meizu","Nubia","RED","Razer","Sharp","ZTE","Acer","Panasonic","Microsoft","Amazon","BlackBerry"];
const PERFILES={
  A:{genMin:144,genMax:200,rojoD:[0,3],x2D:[-12,-6],franMin:62,franMax:76,camaraD:[16,28],dpiMin:530,dpiMax:610},
  B:{genMin:145,genMax:196,rojoD:[0,3],x2D:[-12,-6],franMin:55,franMax:72,camaraD:[14,26],dpiMin:530,dpiMax:600},
  B2:{genMin:143,genMax:188,rojoD:[0,2],x2D:[-14,-7],franMin:53,franMax:70,camaraD:[13,24],dpiMin:530,dpiMax:595},
  B3:{genMin:146,genMax:193,rojoD:[0,2],x2D:[-13,-7],franMin:55,franMax:73,camaraD:[14,26],dpiMin:530,dpiMax:598},
  B4:{genMin:143,genMax:196,rojoD:[0,3],x2D:[-13,-7],franMin:57,franMax:75,camaraD:[15,27],dpiMin:530,dpiMax:602},
  C:{genMin:148,genMax:182,rojoD:[0,2],x2D:[-10,-5],franMin:50,franMax:68,camaraD:[18,32],dpiMin:530,dpiMax:580},
  D:{genMin:145,genMax:192,rojoD:[0,3],x2D:[-12,-6],franMin:54,franMax:71,camaraD:[14,26],dpiMin:530,dpiMax:596},
  E:{genMin:85,genMax:200,rojoD:[0,4],x2D:[-18,-10],franMin:52,franMax:70,camaraD:[20,36],dpiMin:0,dpiMax:0},
  V:{genMin:162,genMax:200,rojoD:[0,2],x2D:[-6,-2],franMin:66,franMax:80,camaraD:[8,16],dpiMin:600,dpiMax:630},
};
function _grp(m){if(m==="iPhone")return"E";if(_GA.has(m))return"A";if(_GB.has(m))return"B";if(_GB2.has(m))return"B2";if(_GB3.has(m))return"B3";if(_GB4.has(m))return"B4";if(_GC.has(m))return"C";return"D";}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function detectarMarca(txt){const t=txt.toLowerCase();let f=null;for(const m of MARCAS){if(t.includes(m.toLowerCase())){if(!f||m.length>f.length)f=m;}}return f;}
function extraerModelo(txt,marca){const stop=["para","un","una","el","la","con","sin","dpi","quiero","dame","necesito","sensibilidad","alta","media","baja","por favor","porfavor","me","puedes","dar","genera","generame","generar"];let m=txt.replace(new RegExp(marca,"gi"),"").trim();stop.forEach(w=>{m=m.replace(new RegExp("\\b"+w+"\\b","gi")," ");});return m.replace(/\s+/g," ").trim()||marca;}

function generarSensi(marca,modelo,nivel,usarDpi){
  const grp=_grp(marca),iP=(grp==="E"),p=PERFILES[grp];
  let gLo,gHi;
  if(iP){if(nivel==="baja"){gLo=89;gHi=120;}else if(nivel==="media"){gLo=121;gHi=169;}else{gLo=172;gHi=200;}}
  else{if(nivel==="baja"){gLo=clamp(Math.max(p.genMin,149),149,158);gHi=clamp(Math.min(158,p.genMax),149,158);}else if(nivel==="media"){gLo=clamp(Math.max(p.genMin,159),159,171);gHi=clamp(Math.min(171,p.genMax),159,171);}else{gLo=clamp(Math.max(p.genMin,176),176,200);gHi=clamp(Math.min(200,p.genMax),176,200);}}
  if(gLo>gHi){gLo=p.genMin;gHi=p.genMax;}
  const general=clamp(rand(gLo,gHi),100,200);
  const hsR=Math.random(),hs=hsR<0.60?"full":hsR<0.90?"mid":"normal";
  let rojo;
  if(nivel==="baja"){const mn=2;if(hs==="full")rojo=clamp(general+Math.max(p.rojoD[0],mn),100,200);else if(hs==="mid")rojo=clamp(general+Math.max(Math.round((p.rojoD[0]+p.rojoD[1])/2),mn),100,200);else rojo=clamp(general+Math.max(p.rojoD[1],mn+1),100,200);}
  else if(hs==="full")rojo=clamp(general+p.rojoD[0],100,200);else if(hs==="mid")rojo=clamp(general+Math.round((p.rojoD[0]+p.rojoD[1])/2),100,200);else rojo=clamp(general+p.rojoD[1],100,200);
  const xLo=Math.abs(p.x2D[1]),xHi=Math.abs(p.x2D[0]);
  let x2,x4;
  if(nivel==="baja"){const d=rand(xLo,Math.round(xLo+(xHi-xLo)*0.55));x2=clamp(rojo-Math.max(d,xLo),100,rojo-xLo);}
  else if(nivel==="media"){const d=rand(Math.round(xLo+(xHi-xLo)*0.25),Math.round(xLo+(xHi-xLo)*0.75));x2=clamp(rojo-Math.max(d,xLo),100,rojo-xLo);}
  else{const d=rand(xLo,Math.round(xLo+(xHi-xLo)*0.45));x2=clamp(rojo-Math.max(d,xLo),100,rojo-xLo);}
  x4=clamp(x2+rand(20,27),100,200);
  const fMin=Math.max(p.franMin,100),fMax=Math.min(p.franMax,200),fD=fMax-fMin;
  let fLo,fHi;
  if(nivel==="baja"){fLo=fMin;fHi=Math.round(fMin+fD*0.40);}else if(nivel==="media"){fLo=Math.round(fMin+fD*0.20);fHi=Math.round(fMin+fD*0.70);}else{fLo=Math.round(fMin+fD*0.48);fHi=fMax;}
  let franco=clamp(rand(fLo,fHi),fMin,fMax);
  const cD=p.camaraD[1]-p.camaraD[0];
  let cLo,cHi;
  if(nivel==="baja"){cLo=p.camaraD[0];cHi=Math.round(p.camaraD[0]+cD*0.38);}else if(nivel==="media"){cLo=Math.round(p.camaraD[0]+cD*0.22);cHi=Math.round(p.camaraD[0]+cD*0.72);}else{cLo=Math.round(p.camaraD[0]+cD*0.50);cHi=p.camaraD[1];}
  const camara=clamp(general+rand(cLo,cHi),100,200);
  function _b(){if(nivel==="baja"){if(hs==="full")return rand(32,34);if(hs==="mid")return rand(33,35);return rand(34,36);}else if(nivel==="media"){if(hs==="full")return rand(36,39);if(hs==="mid")return rand(38,41);return rand(40,43);}else{if(hs==="full")return rand(40,43);if(hs==="mid")return rand(42,46);return rand(44,49);}}
  let boton=iP?clamp(nivel==="baja"?rand(38,46):nivel==="media"?rand(42,49):rand(44,52),35,52):_b();
  const rd=rojo-general;
  if(hs==="full"||rd>=3)boton=clamp(boton-rand(2,3),32,boton);else if(rd>=1)boton=clamp(boton-1,32,boton);
  boton=clamp(boton,32,52);
  if(rojo<=general)rojo=clamp(general+1,100,200);
  if(x2>=rojo)x2=clamp(rojo-xLo,100,rojo-1);
  if(x4<=x2)x4=clamp(x2+20,100,200);
  if(franco>=x2)franco=clamp(x2-1,fMin,x2-1);
  rojo=clamp(rojo,100,200);x2=clamp(x2,100,200);x4=clamp(x4,100,200);
  let dpi=null;
  if(usarDpi&&!iP&&p.dpiMin>0){let base;if(nivel==="baja")base=rand(Math.round(p.dpiMin+(p.dpiMax-p.dpiMin)*0.55),p.dpiMax);else if(nivel==="media")base=rand(Math.round(p.dpiMin+(p.dpiMax-p.dpiMin)*0.25),Math.round(p.dpiMin+(p.dpiMax-p.dpiMin)*0.75));else base=rand(p.dpiMin,Math.round(p.dpiMin+(p.dpiMax-p.dpiMin)*0.45));dpi=clamp(base+rand(-4,4),530,630);}
  return{general,rojo,x2,x4,franco,camara,boton,dpi,nivel,hs};
}

// ── ESTADO ────────────────────────────────────────────────
const MAX=5;
const NL={baja:"🟢 BAJA",media:"🔵 MEDIA",alta:"🔴 ALTA"};
let nickname="", step="idle", data={marca:"",modelo:"",nivel:"",dpi:false}, myCount=0;

function getTodayKey(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

async function loadMyCount(){
  if(!nickname) return;
  const ref=doc(db,"usuarios",nickname+"_"+getTodayKey());
  const snap=await getDoc(ref);
  myCount=snap.exists()?snap.data().count:0;
  updateCounter();
}

async function saveMyCount(){
  const ref=doc(db,"usuarios",nickname+"_"+getTodayKey());
  await setDoc(ref,{count:myCount,nickname,fecha:getTodayKey()});
}

function updateCounter(){
  document.getElementById("counterLabel").textContent=(MAX-myCount)+"/"+MAX+" SENSIS HOY";
}

// ── FEED EN VIVO ────────────────────────────────────────
const feedQ=query(collection(db,"feed"),orderBy("ts","desc"),limit(30));
onSnapshot(feedQ,snap=>{
  const feed=document.getElementById("publicFeed");
  feed.innerHTML="";
  const docs=[...snap.docs].reverse();
  docs.forEach(d=>{
    const item=d.data();
    const el=document.createElement("div");
    el.className="feed-item";
    const t=item.ts?.toDate?new Date(item.ts.toDate()).toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"}):"-";
    const nivelCSS=item.nivel==="baja"?"nivel-baja":item.nivel==="media"?"nivel-media":"nivel-alta";
    el.innerHTML=`<div class="feed-header"><span class="feed-user">☠️ ${item.nickname||"User"}</span><span class="feed-time">${t}</span></div>
    <div class="feed-msg">📱 ${item.marca} ${item.modelo}</div>
    <span class="feed-nivel ${nivelCSS}">${NL[item.nivel]||""} ${item.hs==="full"?"🎯 HS":item.hs==="mid"?"⚡ MID":""}</span>
    <div class="feed-result">🎮 General: ${item.general}\n🔴 Mira Rojo: ${item.rojo}\n🔭 Mira 2X: ${item.x2}\n🔬 Mira 4X: ${item.x4}\n🎯 Franco: ${item.franco}\n📷 Cámara: ${item.camara}\n🔫 Botón: ${item.boton}${item.dpi?"\n🔵 DPI: "+item.dpi:""}</div>`;
    feed.appendChild(el);
  });
  feed.scrollTop=feed.scrollHeight;
  // online count simulado
  document.getElementById("onlineCount").textContent=Math.max(1,docs.length>0?Math.floor(Math.random()*8)+2:1);
});

// ── MI CHAT ────────────────────────────────────────────
function addMyMsg(from,text,opts={}){
  const container=document.getElementById("myChatMessages");
  const wrap=document.createElement("div");
  wrap.className="msg-wrap "+from;
  const bub=document.createElement("div");
  bub.className="bubble "+from;
  bub.textContent=text;
  if(opts.copyText){
    const btn=document.createElement("button");
    btn.className="copy-btn";btn.textContent="📋 COPIAR SENSIBILIDAD";
    btn.onclick=function(){
      const el=document.createElement("textarea");
      el.value=opts.copyText;el.style.position="fixed";el.style.opacity="0";
      document.body.appendChild(el);el.select();document.execCommand("copy");document.body.removeChild(el);
      btn.textContent="✅ COPIADO";btn.classList.add("copied");
      setTimeout(()=>{btn.textContent="📋 COPIAR SENSIBILIDAD";btn.classList.remove("copied");},2000);
    };
    bub.appendChild(btn);
  }
  wrap.appendChild(bub);
  if(opts.buttons){
    const btns=document.createElement("div");btns.className="btns";
    opts.buttons.forEach(b=>{
      const btn=document.createElement("button");btn.className="opt-btn";btn.textContent=b;
      btn.onclick=()=>handleBtn(b,btns);btns.appendChild(btn);
    });
    wrap.appendChild(btns);
  }
  container.appendChild(wrap);
  container.scrollTop=container.scrollHeight;
}

function handleBtn(btn,btnsEl){
  btnsEl.querySelectorAll(".opt-btn").forEach(b=>b.disabled=true);
  if(step==="nivel"){
    const nivel=btn.includes("Baja")?"baja":btn.includes("Media")?"media":"alta";
    data.nivel=nivel;addMyMsg("user",btn);step="dpi";
    setTimeout(()=>addMyMsg("bot","¿Con DPI calibrado?",{buttons:["✅ Sí, con DPI","❌ Sin DPI"]}),300);
  } else if(step==="dpi"){
    data.dpi=btn.includes("Sí");addMyMsg("user",btn);
    setTimeout(async()=>{
      const r=generarSensi(data.marca,data.modelo,data.nivel,data.dpi);
      myCount++;await saveMyCount();updateCounter();
      const hs=r.hs==="full"?"🎯 HEADSHOT CONFIG":r.hs==="mid"?"⚡ HEADSHOT MID":"";
      const dpiL=r.dpi?"\n🔵 DPI: "+r.dpi:"";
      const txt="✅ SENSIBILIDAD GENERADA\n📱 "+data.marca+" "+data.modelo+"\n"+NL[r.nivel]+" "+hs+"\n\n🎮 General: "+r.general+"\n🔴 Mira Rojo: "+r.rojo+"\n🔭 Mira 2X: "+r.x2+"\n🔬 Mira 4X: "+r.x4+"\n🎯 Francotirador: "+r.franco+"\n📷 Cámara 360°: "+r.camara+"\n🔫 Botón Disparo: "+r.boton+dpiL+"\n\n— SENSIS GOOD FF ☠️⚡";
      addMyMsg("bot",txt,{copyText:txt});
      // Publicar en feed
      await addDoc(collection(db,"feed"),{nickname,marca:data.marca,modelo:data.modelo,nivel:r.nivel,hs:r.hs,general:r.general,rojo:r.rojo,x2:r.x2,x4:r.x4,franco:r.franco,camara:r.camara,boton:r.boton,dpi:r.dpi||null,ts:serverTimestamp()});
      const rem=MAX-myCount;
      setTimeout(()=>{
        if(rem>0)addMyMsg("bot","Te quedan "+rem+" sensibilidad"+(rem!==1?"es":"")+" gratuita"+(rem!==1?"s":"")+" hoy.\n\n¿Quieres otra? Escribe tu marca y modelo.");
        else addMyMsg("bot","⛔ Llegaste al límite de hoy (5/5).\n\nVuelve mañana para 5 nuevas gratis. ☠️⚡");
        step="idle";
      },400);
    },300);
  }
}

window.handleSend=function(){
  const input=document.getElementById("msgInput");
  const msg=input.value.trim();if(!msg)return;input.value="";
  if(step!=="idle"){addMyMsg("user",msg);return;}
  if(myCount>=MAX){addMyMsg("user",msg);setTimeout(()=>addMyMsg("bot","⛔ Llegaste al límite de hoy (5/5).\n\nVuelve mañana. ☠️⚡"),300);return;}
  const marca=detectarMarca(msg);addMyMsg("user",msg);
  if(marca){
    const modelo=extraerModelo(msg,marca);
    data={marca,modelo,nivel:"",dpi:false};step="nivel";
    setTimeout(()=>addMyMsg("bot","📱 "+marca+" "+modelo+"\n\n¿Qué nivel de sensibilidad?",{buttons:["🟢 Baja","🔵 Media","🔴 Alta"]}),300);
  } else {
    setTimeout(()=>addMyMsg("bot","No reconocí la marca. Ej:\n📱 Honor X5C Plus\n📱 Samsung Galaxy A54\n📱 Xiaomi Redmi Note 12"),300);
  }
};

document.getElementById("msgInput").addEventListener("keydown",e=>{if(e.key==="Enter")window.handleSend();});

// ── TABS ──────────────────────────────────────────────
window.switchTab=function(tab){
  document.getElementById("tabFeed").classList.toggle("active",tab==="feed");
  document.getElementById("tabMio").classList.toggle("active",tab==="mio");
  document.getElementById("publicFeed").style.display=tab==="feed"?"flex":"none";
  document.getElementById("myChat").style.display=tab==="mio"?"flex":"none";
};

// ── ENTRAR ────────────────────────────────────────────
window.entrar = async function(){
  const n=document.getElementById("nicknameInput").value.trim();
  if(!n||n.length<2){alert("Pon un nombre de al menos 2 letras");return;}
  nickname=n;
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("chatScreen").style.display="flex";
  document.getElementById("chatScreen").style.flexDirection="column";
  await loadMyCount();
  addMyMsg("bot","⚡ Hola "+nickname+"!\n\nDime tu marca y modelo para generar tu sensibilidad.\n\nEj: Honor X5C Plus");
  switchTab("mio");
};

document.getElementById("nicknameInput").addEventListener("keydown",e=>{if(e.key==="Enter")window.entrar();});
document.getElementById("loginBtn").addEventListener("click",window.entrar);
document.getElementById("tabFeed").addEventListener("click",()=>window.switchTab("feed"));
document.getElementById("tabMio").addEventListener("click",()=>window.switchTab("mio"));
document.getElementById("sendBtn").addEventListener("click",window.handleSend);
</script>
</body>
</html>
