html,body{height:100%;background:#03070D;font-family:system-ui,sans-serif;color:#E4F2FF;}
#app{width:100%;max-width:520px;height:100vh;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;position:relative;}

/* FONDOS */
body.bg-matrix{background:#000;}
body.bg-rain{background:linear-gradient(180deg,#000510,#001020);}
body.bg-cyber{background:linear-gradient(135deg,#050010,#001030,#050010);}

canvas#matrixCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none;}
#app{position:relative;z-index:1;}

.header h1{font-size:18px;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,#fff,#38BEFF,#0A84FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

.hinfo{font-size:9px;letter-spacing:2px;color:rgba(160,215,255,0.4);text-transform:uppercase;}

@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
.icon-btn{background:none;border:none;color:rgba(160,215,255,0.5);font-size:18px;cursor:pointer;padding:4px;border-radius:8px;transition:all 0.2s;}
.icon-btn:hover{color:#38BEFF;background:rgba(56,190,255,0.1);}

.modal-box{background:linear-gradient(135deg,#040e28,#02081c);border:1px solid rgba(56,190,255,0.2);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:520px;max-height:80vh;overflow-y:auto;}
.modal-title{font-size:13px;font-weight:900;letter-spacing:3px;color:#38BEFF;text-align:center;margin-bottom:16px;text-transform:uppercase;}

.modal-label{font-size:10px;font-weight:800;letter-spacing:2px;color:rgba(160,215,255,0.5);text-transform:uppercase;}

.modal-btn{width:100%;border:none;border-radius:12px;padding:12px;font-weight:900;font-size:12px;letter-spacing:2px;cursor:pointer;text-transform:uppercase;margin-bottom:8px;}

.nivel-media{background:rgba(56,190,255,0.1);border:1px solid rgba(56,190,255,0.3);color:#38BEFF;}
.nivel-alta{background:rgba(255,85,102,0.1);border:1px solid rgba(255,85,102,0.3);color:#FF5566;}
.feed-result{font-size:12px;font-weight:700;line-height:1.7;color:#E4F2FF;white-space:pre-wrap;}
.reactions-bar{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;min-height:10px;}
.r-chip{background:rgba(56,190,255,0.08);border:1px solid rgba(56,190,255,0.18);border-radius:99px;padding:3px 9px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:3px;transition:all 0.15s;}

.r-chip .rc{font-size:10px;font-weight:800;color:rgba(160,215,255,0.7);}
.hold-hint{font-size:9px;color:rgba(160,215,255,0.2);margin-top:6px;letter-spacing:1px;}

.ep-emoji{font-size:24px;cursor:pointer;padding:4px 6px;border-radius:8px;transition:transform 0.1s;}

.ep-close{width:100%;text-align:center;font-size:10px;color:rgba(160,215,255,0.3);cursor:pointer;margin-top:4px;letter-spacing:2px;}

.btns{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap;}
.opt-btn{background:rgba(10,100,230,0.12);border:1px solid rgba(56,190,255,0.28);border-radius:10px;padding:8px 14px;color:#38BEFF;font-size:12px;font-weight:800;cursor:pointer;}

.copy-btn{display:block;margin-top:8px;width:100%;background:rgba(56,190,255,0.08);border:1px solid rgba(56,190,255,0.22);border-radius:9px;padding:8px;color:#38BEFF;font-size:10px;font-weight:800;letter-spacing:2px;cursor:pointer;text-transform:uppercase;}
.copy-btn.copied{background:rgba(61,255,143,0.12);border-color:rgba(61,255,143,0.35);color:#3DFF8F;}
.input-area{flex-shrink:0;padding:8px 12px 14px;display:flex;gap:8px;background:rgba(3,7,20,0.98);border-top:1px solid rgba(56,190,255,0.08);}
#msgInput{flex:1;background:rgba(4,16,48,0.92);border:1px solid rgba(56,190,255,0.15);border-radius:12px;padding:11px 15px;color:#E4F2FF;font-family:inherit;font-size:14px;font-weight:600;outline:none;}

#sendBtn{background:linear-gradient(160deg,#2BB8FF,#0A84FF,#0052D4);border:none;border-radius:12px;padding:11px 16px;color:#fff;font-weight:900;font-size:17px;cursor:pointer;flex-shrink:0;}

/* scrollbar */
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:rgba(56,190,255,0.2);border-radius:3px;}
</style>
</head>

function extraerModelo(txt,marca){const stop=["para","un","una","el","la","con","sin","dpi","quiero","dame","necesito","sensibilidad","alta","media","baja","por favor","porfavor","me","puedes","dar","genera","generame","generar"];let m=txt.replace(new RegExp(marca,"gi"),"").trim();stop.forEach(w=>{m=m.replace(new RegExp("\\b"+w+"\\b","gi")," ");});return m.replace(/\s+/g," ").trim()||marca;}
function generarSensi(marca,modelo,nivel,usarDpi){const grp=_grp(marca),iP=(grp==="E"),p=PERFILES[grp];let gLo,gHi;if(iP){if(nivel==="baja"){gLo=89;gHi=120;}else if(nivel==="media"){gLo=121;gHi=169;}else{gLo=172;gHi=200;}}else{if(nivel==="baja"){gLo=clamp(Math.max(p.genMin,149),149,158);gHi=clamp(Math.min(158,p.genMax),149,158);}else if(nivel==="media"){gLo=clamp(Math.max(p.genMin,159),159,171);gHi=clamp(Math.min(171,p.genMax),159,171);}else{gLo=clamp(Math.max(p.genMin,176),176,200);gHi=clamp(Math.min(200,p.genMax),176,200);}}if(gLo>gHi){gLo=p.genMin;gHi=p.genMax;}const general=clamp(rand(gLo,gHi),100,200);const hsR=Math.random(),hs=hsR<0.60?"full":hsR<0.90?"mid":"normal";let rojo;if(nivel==="baja"){const mn=2;if(hs==="full")rojo=clamp(general+Math.max(p.rojoD[0],mn),100,200);else if(hs==="mid")rojo=clamp(general+Math.max(Math.round((p.rojoD[0]+p.rojoD[1])/2),mn),100,200);else rojo=clamp(general+Math.max(p.rojoD[1],mn+1),100,200);}else if(hs==="full")rojo=clamp(general+p.rojoD[0],100,200);else if(hs==="mid")rojo=clamp(general+Math.round((p.rojoD[0]+p.rojoD[1])/2),100,200);else rojo=clamp(general+p.rojoD[1],100,200);const xLo=Math.abs(p.x2D[1]),xHi=Math.abs(p.x2D[0]);let x2,x4;if(nivel==="baja"){const d=rand(xLo,Math.round(xLo+(xHi-xLo)*0.55));x2=clamp(rojo-Math.max(d,xLo),100,rojo-xLo);}else if(nivel==="media"){const d=rand(Math.round(xLo+(xHi-xLo)*0.25),Math.round(xLo+(xHi-xLo)*0.75));x2=clamp(rojo-Math.max(d,xLo),100,rojo-xLo);}else{const d=rand(xLo,Math.round(xLo+(xHi-xLo)*0.45));x2=clamp(rojo-Math.max(d,xLo),100,rojo-xLo);}x4=clamp(x2+rand(20,27),100,200);const fMin=Math.max(p.franMin,100),fMax=Math.min(p.franMax,200),fD=fMax-fMin;let fLo,fHi;if(nivel==="baja"){fLo=fMin;fHi=Math.round(fMin+fD*0.40);}else if(nivel==="media"){fLo=Math.round(fMin+fD*0.20);fHi=Math.round(fMin+fD*0.70);}else{fLo=Math.round(fMin+fD*0.48);fHi=fMax;}let franco=clamp(rand(fLo,fHi),fMin,fMax);const cD=p.camaraD[1]-p.camaraD[0];let cLo,cHi;if(nivel==="baja"){cLo=p.camaraD[0];cHi=Math.round(p.camaraD[0]+cD*0.38);}else if(nivel==="media"){cLo=Math.round(p.camaraD[0]+cD*0.22);cHi=Math.round(p.camaraD[0]+cD*0.72);}else{cLo=Math.round(p.camaraD[0]+cD*0.50);cHi=p.camaraD[1];}const camara=clamp(general+rand(cLo,cHi),100,200);function _b(){if(nivel==="baja"){if(hs==="full")return rand(32,34);if(hs==="mid")return rand(33,35);return rand(34,36);}else if(nivel==="media"){if(hs==="full")return rand(36,39);if(hs==="mid")return rand(38,41);return rand(40,43);}else{if(hs==="full")return rand(40,43);if(hs==="mid")return rand(42,46);return rand(44,49);}}let boton=iP?clamp(nivel==="baja"?rand(38,46):nivel==="media"?rand(42,49):rand(44,52),35,52):_b();const rd=rojo-general;if(hs==="full"||rd>=3)boton=clamp(boton-rand(2,3),32,boton);else if(rd>=1)boton=clamp(boton-1,32,boton);boton=clamp(boton,32,52);if(rojo<=general)rojo=clamp(general+1,100,200);if(x2>=rojo)x2=clamp(rojo-xLo,100,rojo-1);if(x4<=x2)x4=clamp(x2+20,100,200);if(franco>=x2)franco=clamp(x2-1,fMin,x2-1);rojo=clamp(rojo,100,200);x2=clamp(x2,100,200);x4=clamp(x4,100,200);let dpi=null;if(usarDpi&&!iP&&p.dpiMin>0){let base;if(nivel==="baja")base=rand(Math.round(p.dpiMin+(p.dpiMax-p.dpiMin)*0.55),p.dpiMax);else if(nivel==="media")base=rand(Math.round(p.dpiMin+(p.dpiMax-p.dpiMin)*0.25),Math.round(p.dpiMin+(p.dpiMax-p.dpiMin)*0.75));else base=rand(p.dpiMin,Math.round(p.dpiMin+(p.dpiMax-p.dpiMin)*0.45));dpi=clamp(base+rand(-4,4),530,630);}return{general,rojo,x2,x4,franco,camara,boton,dpi,nivel,hs};}

// ── MATRIX BACKGROUND ─────────────────────────────────
const canvas=document.getElementById("matrixCanvas");
const ctx=canvas.getContext("2d");
let matrixInterval=null;
function startMatrix(){
  canvas.style.display="block";
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  const cols=Math.floor(canvas.width/16); const drops=Array(cols).fill(1);
  const chars="アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモ0123456789ABCDEF☠️⚡";
  matrixInterval=setInterval(()=>{
    ctx.fillStyle="rgba(0,0,0,0.05)"; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#0f0"; ctx.font="14px monospace";
    drops.forEach((y,i)=>{ const c=chars[Math.floor(Math.random()*chars.length)]; ctx.fillText(c,i*16,y*16); if(y*16>canvas.height&&Math.random()>0.975)drops[i]=0; drops[i]++; });
  },50);
}
function stopMatrix(){ if(matrixInterval){clearInterval(matrixInterval);matrixInterval=null;} canvas.style.display="none"; ctx.clearRect(0,0,canvas.width,canvas.height); }

function applyBg(bg){
  currentBg=bg;
  document.body.className="";
  stopMatrix();
  if(bg==="matrix"){document.body.classList.add("bg-matrix");startMatrix();}
  else if(bg==="rain") document.body.classList.add("bg-rain");
  else if(bg==="cyber") document.body.classList.add("bg-cyber");
  else if(bg==="fire") document.body.classList.add("bg-fire");
  else if(bg==="neon") document.body.style.background="linear-gradient(135deg,#0a0020,#1a0040,#0a0020)";
  document.querySelectorAll(".bg-opt").forEach(o=>o.classList.toggle("selected",o.dataset.bg===bg));
  saveSession();
}

async function reaccionar(docId, emoji){
  if(!nickname) return;
  const ref=doc(db,"feed",docId);
  const snap=await getDoc(ref);
  if(!snap.exists()) return;
  const reactions=snap.data().reactions||{};
  if(!reactions[emoji]) reactions[emoji]={};
  if(reactions[emoji][nickname]) delete reactions[emoji][nickname];
  else reactions[emoji][nickname]=true;
  await updateDoc(ref,{reactions});
}

// ── FEED ──────────────────────────────────────────────
function buildFeedItem(id, item){
  const el=document.createElement("div");
  el.className="feed-item"; el.dataset.id=id;
  const t=item.ts?.toDate?new Date(item.ts.toDate()).toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"}):"-";
  const nivelCSS=item.nivel==="baja"?"nivel-baja":item.nivel==="media"?"nivel-media":"nivel-alta";
  const hsLabel=item.hs==="full"?"🎯 HS":item.hs==="mid"?"⚡ MID":"";
  const dpiLine=item.dpi?"\n🔵 DPI: "+item.dpi:"";
  const reactions=item.reactions||{};
  const chips=Object.entries(reactions).filter(([,u])=>Object.keys(u).length>0).map(([emoji,users])=>{
    const count=Object.keys(users).length;
    const mine=users[nickname]?"mine":"";
    return `<span class="r-chip ${mine}" data-emoji="${emoji}" data-docid="${id}">${emoji}<span class="rc">${count}</span></span>`;
  }).join("");

  el.innerHTML=`
    <div class="feed-header"><span class="feed-user">☠️ ${item.nickname||"User"}</span><span class="feed-time">${t}</span></div>
    <div class="feed-msg">📱 ${item.marca} ${item.modelo}</div>
    <span class="feed-nivel ${nivelCSS}">${NL[item.nivel]||""} ${hsLabel}</span>
    <div class="feed-result">🎮 General: ${item.general}\n🔴 Mira Rojo: ${item.rojo}\n🔭 Mira 2X: ${item.x2}\n🔬 Mira 4X: ${item.x4}\n🎯 Francotirador: ${item.franco}\n📷 Cámara 360°: ${item.camara}\n🔫 Botón Disparo: ${item.boton}${dpiLine}</div>
    <div class="reactions-bar" id="rbar-${id}">${chips}</div>
    <div class="hold-hint">mantén presionado para reaccionar</div>
  `;

  // Long press móvil
  let pressTimer, moved=false;
  el.addEventListener("touchstart",(e)=>{ moved=false; pressTimer=setTimeout(()=>{ if(!moved) showPicker(id,e.touches[0].clientX,e.touches[0].clientY); },600); },{passive:true});
  el.addEventListener("touchmove",()=>{ moved=true; clearTimeout(pressTimer); },{passive:true});
  el.addEventListener("touchend",()=>clearTimeout(pressTimer),{passive:true});
  // Desktop
  el.addEventListener("contextmenu",(e)=>{ e.preventDefault(); showPicker(id,e.clientX,e.clientY); });

  // Click en chips existentes
  el.querySelectorAll(".r-chip").forEach(chip=>{
    chip.addEventListener("click",(e)=>{ e.stopPropagation(); reaccionar(chip.dataset.docid,chip.dataset.emoji); });
  });

  return el;
}

const feedQ=query(collection(db,"feed"),orderBy("ts","desc"),limit(40));
onSnapshot(feedQ,snap=>{
  const feed=document.getElementById("feedPanel");
  const wasAtBottom=feed.scrollHeight-feed.scrollTop-feed.clientHeight<60;
  feed.innerHTML="";
  [...snap.docs].reverse().forEach(d=>feed.appendChild(buildFeedItem(d.id,d.data())));
  if(wasAtBottom) feed.scrollTop=feed.scrollHeight;
  document.getElementById("onlineCount").textContent=Math.max(1,Math.min(snap.docs.length+Math.floor(Math.random()*3)+1,30));
});

function addMyMsg(from,text,opts={}){
  const container=document.getElementById("myChatMessages");
  const wrap=document.createElement("div"); wrap.className="msg-wrap "+from;
  const bub=document.createElement("div"); bub.className="bubble "+(opts.isAdmin?"admin-pm":from);
  bub.textContent=text;
  if(opts.copyText){
    const btn=document.createElement("button"); btn.className="copy-btn"; btn.textContent="📋 COPIAR SENSIBILIDAD";
    btn.addEventListener("click",()=>{
      const el=document.createElement("textarea"); el.value=opts.copyText; el.style.cssText="position:fixed;opacity:0;";
      document.body.appendChild(el); el.select(); document.execCommand("copy"); document.body.removeChild(el);
      btn.textContent="✅ COPIADO"; btn.classList.add("copied");
      setTimeout(()=>{ btn.textContent="📋 COPIAR SENSIBILIDAD"; btn.classList.remove("copied"); },2000);
    });
    bub.appendChild(btn);
  }
  wrap.appendChild(bub);
  if(opts.buttons){
    const btns=document.createElement("div"); btns.className="btns";
    opts.buttons.forEach(b=>{
      const btn=document.createElement("button"); btn.className="opt-btn"; btn.textContent=b;
      btn.addEventListener("click",()=>handleBtn(b,btns)); btns.appendChild(btn);
    });
    wrap.appendChild(btns);
  }
  container.appendChild(wrap);
  container.scrollTop=container.scrollHeight;
}

function handleBtn(btn,btnsEl){
  btnsEl.querySelectorAll(".opt-btn").forEach(b=>b.disabled=true);
  if(step==="nivel"){
    const nivel=btn.includes("Baja")?"baja":btn.includes("Media")?"media":"alta";
    data.nivel=nivel; addMyMsg("user",btn); step="dpi";
    setTimeout(()=>addMyMsg("bot","¿Con DPI calibrado?",{buttons:["✅ Sí, con DPI","❌ Sin DPI"]}),300);
  } else if(step==="dpi"){
    data.dpi=btn.includes("Sí"); addMyMsg("user",btn);
    setTimeout(async()=>{
      const r=generarSensi(data.marca,data.modelo,data.nivel,data.dpi);
      myCount++; saveSession(); updateCounter();
      const hs=r.hs==="full"?"🎯 HEADSHOT CONFIG":r.hs==="mid"?"⚡ HEADSHOT MID":"";
      const dpiL=r.dpi?"\n🔵 DPI: "+r.dpi:"";
      const txt="✅ SENSIBILIDAD GENERADA\n📱 "+data.marca+" "+data.modelo+"\n"+NL[r.nivel]+" "+hs+"\n\n🎮 General: "+r.general+"\n🔴 Mira Rojo: "+r.rojo+"\n🔭 Mira 2X: "+r.x2+"\n🔬 Mira 4X: "+r.x4+"\n🎯 Francotirador: "+r.franco+"\n📷 Cámara 360°: "+r.camara+"\n🔫 Botón Disparo: "+r.boton+dpiL+"\n\n— SENSIS GOOD FF ☠️⚡";
      addMyMsg("bot",txt,{copyText:txt});
      // guardar en Firestore
      await addDoc(collection(db,"feed"),{nickname,marca:data.marca,modelo:data.modelo,nivel:r.nivel,hs:r.hs,general:r.general,rojo:r.rojo,x2:r.x2,x4:r.x4,franco:r.franco,camara:r.camara,boton:r.boton,dpi:r.dpi||null,reactions:{},ts:serverTimestamp()});
      // stats usuario
      const uRef=doc(db,"usuarios",nickname);
      const uSnap=await getDoc(uRef);
      const prev=uSnap.exists()?uSnap.data():{};
      await setDoc(uRef,{nickname,totalSensi:(prev.totalSensi||0)+1,lastSeen:serverTimestamp(),banned:prev.banned||false,maxOverride:prev.maxOverride||null},{merge:true});

      const rem=myMax-myCount;
      setTimeout(()=>{
        if(rem>0) addMyMsg("bot","Te quedan "+rem+" sensibilidad"+(rem!==1?"es":"")+" hoy.\n\n¿Quieres otra? Escribe tu marca y modelo.");
        else addMyMsg("bot","⛔ Llegaste al límite de hoy.\n\nVuelve mañana. ☠️⚡");
        step="idle";
      },400);
    },300);
  }
}

function handleSend(){
  const input=document.getElementById("msgInput");
  const msg=input.value.trim(); if(!msg) return; input.value="";
  if(step!=="idle"){ addMyMsg("user",msg); return; }
  if(myCount>=myMax){ addMyMsg("user",msg); setTimeout(()=>addMyMsg("bot","⛔ Llegaste al límite de hoy.\n\nVuelve mañana. ☠️⚡"),300); return; }
  const marca=detectarMarca(msg); addMyMsg("user",msg);
  if(marca){
    const modelo=extraerModelo(msg,marca);
    data={marca,modelo,nivel:"",dpi:false}; step="nivel";
    setTimeout(()=>addMyMsg("bot","📱 "+marca+" "+modelo+"\n\n¿Qué nivel de sensibilidad?",{buttons:["🟢 Baja","🔵 Media","🔴 Alta"]}),300);
  } else {
    setTimeout(()=>addMyMsg("bot","No reconocí la marca. Ej:\n📱 Honor X5C Plus\n📱 Samsung Galaxy A54\n📱 Xiaomi Redmi Note 12"),300);
  }
}

// ── ENTRAR ────────────────────────────────────────────
async function entrar(){
  const n=document.getElementById("nicknameInput").value.trim();
  if(!n||n.length<2){ alert("Pon un nombre de al menos 2 letras"); return; }

  // ADMIN
  if(n===ADMIN_CODE){
    window.location.href="#admin";
    showAdminPanel(); return;
  }

  // Check ban
  const uRef=doc(db,"usuarios",n);
  const uSnap=await getDoc(uRef);
  if(uSnap.exists()){
    const ud=uSnap.data();
    if(ud.banned){
      const until=ud.bannedUntil;
      if(!until || until.toDate()>new Date()){
        alert("⛔ Tu cuenta ha sido suspendida."); return;
      }
    }
    if(ud.maxOverride!==null&&ud.maxOverride!==undefined) myMax=ud.maxOverride;
  }

  nickname=n;
  const sess=loadSession();
  myCount=(sess&&sess.nickname===n)?sess.count:0;
  saveSession();
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("chatScreen").style.display="flex";
  updateCounter();
  switchTab("mio");
  addMyMsg("bot","⚡ Hola "+nickname+"!\n\nDime tu marca y modelo para generar tu sensibilidad.\n\nEj: Honor X5C Plus");

  // Escuchar mensajes privados del admin
  onSnapshot(query(collection(db,"privados"),where("to","==",nickname),orderBy("ts","desc"),limit(5)),snap=>{
    snap.docChanges().forEach(change=>{
      if(change.type==="added"){
        const d=change.doc.data();
        addMyMsg("bot","📩 MENSAJE DEL ADMIN:\n"+d.msg,{isAdmin:true});
      }
    });
  });
}

    </div>
    <div style="background:rgba(4,14,45,0.95);border:1px solid rgba(56,190,255,0.15);border-radius:14px;padding:14px;">
      <div style="font-size:10px;font-weight:800;letter-spacing:2px;color:rgba(160,215,255,0.5);margin-bottom:10px;">📋 USUARIOS REGISTRADOS</div>
      <div id="adminUserList" style="font-size:12px;color:#E4F2FF;line-height:2;">Cargando...</div>
    </div>
  `;
  document.getElementById("app").appendChild(panel);

  // Stats
  async function loadStats(){
    const feedSnap=await getDocs(collection(db,"feed"));
    const userSnap=await getDocs(collection(db,"usuarios"));
    let total=feedSnap.size, users=userSnap.size;
    document.getElementById("statsContent").innerHTML=
      `🎮 Sensibilidades generadas: <b>${total}</b>\n👥 Usuarios registrados: <b>${users}</b>`;

    let list="";
    userSnap.forEach(d=>{
      const u=d.data();
      const banned=u.banned?"⛔":"✅";
      list+=`${banned} <b>${u.nickname}</b> — ${u.totalSensi||0} sensis\n`;
    });
    document.getElementById("adminUserList").innerHTML=list||"Sin usuarios aún.";
  }
  loadStats();

  function getAdminUser(){ return document.getElementById("adminUserInput").value.trim(); }

  document.getElementById("adminViewBtn").addEventListener("click",async()=>{
    const u=getAdminUser(); if(!u) return;
    const snap=await getDoc(doc(db,"usuarios",u));
    if(!snap.exists()){ document.getElementById("adminUserInfo").textContent="Usuario no encontrado."; return; }
    const d=snap.data();
    document.getElementById("adminUserInfo").innerHTML=`👤 ${d.nickname}\n🎮 Total sensis: ${d.totalSensi||0}\n⚠️ Baneado: ${d.banned?"SÍ":"NO"}\n🔢 Límite: ${d.maxOverride!==null&&d.maxOverride!==undefined?d.maxOverride:"Default (5)"}`;
  });

  document.getElementById("adminBanBtn").addEventListener("click",async()=>{
    const u=getAdminUser(); if(!u||!confirm("¿Banear a "+u+"?")) return;
    await setDoc(doc(db,"usuarios",u),{banned:true,bannedUntil:null},{merge:true});
    alert("Usuario baneado permanentemente.");
  });

  document.getElementById("adminUnbanBtn").addEventListener("click",async()=>{
    const u=getAdminUser(); if(!u) return;
    await setDoc(doc(db,"usuarios",u),{banned:false,bannedUntil:null},{merge:true});
    alert("Usuario desbaneado.");
  });

  document.getElementById("adminTempBanBtn").addEventListener("click",async()=>{
    const u=getAdminUser(); if(!u) return;
    const hrs=prompt("¿Cuántas horas de ban temporal?");
    if(!hrs||isNaN(hrs)) return;
    const until=new Date(Date.now()+parseInt(hrs)*3600000);
    await setDoc(doc(db,"usuarios",u),{banned:true,bannedUntil:until},{merge:true});
    alert("Ban temporal de "+hrs+"h aplicado a "+u+".");
  });

  document.getElementById("adminSetMaxBtn").addEventListener("click",async()=>{
    const u=getAdminUser(); const max=parseInt(document.getElementById("adminMaxInput").value);
    if(!u||isNaN(max)) return;
    await setDoc(doc(db,"usuarios",u),{maxOverride:max},{merge:true});
    alert("Límite de "+max+" aplicado a "+u+".");
  });

  document.getElementById("adminSendPmBtn").addEventListener("click",async()=>{
    const u=getAdminUser(); const msg=document.getElementById("adminPmInput").value.trim();
    if(!u||!msg) return;
    await addDoc(collection(db,"privados"),{to:u,msg,ts:serverTimestamp()});
    document.getElementById("adminPmInput").value="";
    alert("Mensaje enviado a "+u+".");
  });
}

// ── AUTO LOGIN ────────────────────────────────────────
const sess=loadSession();
if(sess&&sess.nickname){ document.getElementById("nicknameInput").value=sess.nickname; }
if(sess&&sess.bg) applyBg(sess.bg);

// ── EVENTOS ───────────────────────────────────────────
document.getElementById("loginBtn").addEventListener("click",entrar);
document.getElementById("nicknameInput").addEventListener("keydown",e=>{ if(e.key==="Enter") entrar(); });
document.getElementById("sendBtn").addEventListener("click",handleSend);
document.getElementById("msgInput").addEventListener("keydown",e=>{ if(e.key==="Enter") handleSend(); });
document.getElementById("tabFeed").addEventListener("click",()=>switchTab("feed"));
document.getElementById("tabMio").addEventListener("click",()=>switchTab("mio"));
</script>
</body>
</html>
